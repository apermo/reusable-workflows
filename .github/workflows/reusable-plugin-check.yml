name: WP Plugin Check

on:
    workflow_call:
        inputs:
            wp-version:
                description: 'WordPress version to test against'
                required: false
                type: string
                default: 'latest'
            build-dir:
                description: 'Plugin build directory'
                required: false
                type: string
                default: './'
            checks:
                description: 'Only run specific checks (comma-separated)'
                required: false
                type: string
                default: ''
            exclude-checks:
                description: 'Checks to exclude (comma-separated)'
                required: false
                type: string
                default: ''
            categories:
                description: 'Limit checks to specific categories (comma-separated)'
                required: false
                type: string
                default: ''
            exclude-files:
                description: 'Files to exclude from checks (comma-separated)'
                required: false
                type: string
                default: ''
            exclude-directories:
                description: 'Directories to exclude from checks (comma-separated)'
                required: false
                type: string
                default: ''
            ignore-codes:
                description: 'Error codes to ignore (comma-separated)'
                required: false
                type: string
                default: ''
            ignore-warnings:
                description: 'Ignore warnings'
                required: false
                type: boolean
                default: false
            ignore-errors:
                description: 'Ignore errors'
                required: false
                type: boolean
                default: false
            include-experimental:
                description: 'Include experimental checks'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    plugin-check:
        name: Plugin Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # plugin-check-action provisions its own wp-env (plugin-check plugin,
            # port mapping, plugin slug) only when no .wp-env.json is present. A repo
            # one (required by reusable-wp-e2e.yml) makes the action skip its setup and
            # then die on "Environment not initialized". Move it aside for the run.
            - name: Hide repo wp-env config
              id: hide-wp-env
              run: |
                  moved=
                  for f in .wp-env.json .wp-env.override.json; do
                      if [ -f "$f" ]; then
                          mv "$f" "$f.plugin-check-bak"
                          moved="$moved $f"
                      fi
                  done
                  if [ -n "$moved" ]; then
                      echo "::notice::Moved repo wp-env config aside for plugin-check:$moved"
                      echo "moved=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: wordpress/plugin-check-action@v1
              with:
                  repo-token: ${{ github.token }}
                  wp-version: ${{ inputs.wp-version }}
                  build-dir: ${{ inputs.build-dir }}
                  checks: ${{ inputs.checks }}
                  exclude-checks: ${{ inputs.exclude-checks }}
                  categories: ${{ inputs.categories }}
                  exclude-files: ${{ inputs.exclude-files }}
                  exclude-directories: ${{ inputs.exclude-directories }}
                  ignore-codes: ${{ inputs.ignore-codes }}
                  ignore-warnings: ${{ inputs.ignore-warnings }}
                  ignore-errors: ${{ inputs.ignore-errors }}
                  include-experimental: ${{ inputs.include-experimental }}

            - name: Restore repo wp-env config
              if: always() && steps.hide-wp-env.outputs.moved == 'true'
              run: |
                  for f in .wp-env.json .wp-env.override.json; do
                      if [ -f "$f.plugin-check-bak" ]; then
                          mv "$f.plugin-check-bak" "$f"
                      fi
                  done
