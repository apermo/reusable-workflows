name: Reusable PR Validation

on:
    workflow_call:
        inputs:
            changelog-path:
                description: 'Path to CHANGELOG.md'
                required: false
                type: string
                default: 'CHANGELOG.md'

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            pr_version: ${{ steps.version.outputs.version }}
            result: ${{ steps.version.outputs.result }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            # extract-changelog-version lives in this repo; check it out so a consumer
            # repo (whose checkout above does not contain it) can resolve it. A relative
            # ./ ref alone resolves against the consumer's workspace and fails.
            - name: Check out reusable-workflows actions
              uses: actions/checkout@v5
              with:
                  repository: apermo/reusable-workflows
                  # Pin to THIS reusable workflow's own commit so the action matches the
                  # workflow version the consumer pinned (and so a PR's self-test exercises
                  # the PR's action, not main's).
                  ref: ${{ github.job_workflow_sha }}
                  path: .rw-actions
                  persist-credentials: false

            - name: Extract version from CHANGELOG
              id: version
              uses: ./.rw-actions/.github/actions/extract-changelog-version
              with:
                  changelog-path: ${{ inputs.changelog-path }}

            # The action is a pure classifier; pr-validation applies the fail policy.
            - name: Fail on malformed CHANGELOG
              if: steps.version.outputs.result == 'malformed'
              run: exit 1

            - name: Check CHANGELOG entry
              if: steps.version.outputs.result == 'ok' && steps.version.outputs.prerelease == 'false'
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  SECTION=$(sed -n "/## \[$VERSION\]/,/## \[/p" ${{ inputs.changelog-path }} | head -n -1)
                  CONTENT=$(echo "$SECTION" | grep -v "^#" | grep -v "^$" | head -1)

                  if [ -z "$CONTENT" ]; then
                      echo "::warning::CHANGELOG section for $VERSION appears empty"
                  fi

            # Relies on the "Fail on malformed CHANGELOG" step above to trip failure() —
            # the two are coupled, don't remove one without the other.
            - name: Comment on malformed CHANGELOG
              if: failure() && steps.version.outputs.result == 'malformed'
              uses: actions/github-script@v8
              with:
                  script: |
                      github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: 'CHANGELOG validation failed: malformed version heading in `${{ inputs.changelog-path }}`. Use `## [X.Y.Z] - YYYY-MM-DD` (Semantic Versioning), or `## [Unreleased]` if no release is intended.'
                      })
