name: Reusable Release

on:
    workflow_call:
        inputs:
            changelog-path:
                description: 'Path to CHANGELOG.md'
                required: false
                type: string
                default: 'CHANGELOG.md'
        secrets:
            release-token:
                description: |
                    Token used to push tags, create the release, and comment on
                    the merged PR. Defaults to GITHUB_TOKEN; pass a PAT or
                    GitHub App installation token when downstream `release` /
                    `push: tags` workflows on the calling repo need to fire on
                    the created release (GITHUB_TOKEN loop-prevention
                    suppresses them otherwise).
                required: false

jobs:
    release:
        name: Create Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Extract version from CHANGELOG
              id: version
              uses: ./.github/actions/extract-changelog-version
              with:
                  changelog-path: ${{ inputs.changelog-path }}

            # ok => release; no_version/already_released => skip; malformed => fail loudly
            # (pr-validation should have caught it pre-merge).
            - name: Fail on malformed CHANGELOG
              if: steps.version.outputs.result == 'malformed'
              run: exit 1

            - name: Delete old prerelease artifacts on final release
              if: steps.version.outputs.result == 'ok' && steps.version.outputs.prerelease == 'false'
              run: |
                  for tag in $(git tag -l "v${{ steps.version.outputs.base_version }}-*"); do
                      echo "Deleting prerelease tag: $tag"
                      gh release delete "$tag" --yes --cleanup-tag || true
                  done
              env:
                  GH_TOKEN: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}

            - name: Create release
              if: steps.version.outputs.result == 'ok'
              run: |
                  PRERELEASE_FLAG=""
                  if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
                      PRERELEASE_FLAG="--prerelease"
                  fi

                  gh release create "${{ steps.version.outputs.tag }}" \
                      --title "${{ steps.version.outputs.tag }}" \
                      --generate-notes \
                      $PRERELEASE_FLAG
              env:
                  GH_TOKEN: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}

            - name: Comment on merged PR
              if: steps.version.outputs.result == 'ok'
              uses: actions/github-script@v8
              with:
                  github-token: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}
                  script: |
                      const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          commit_sha: context.sha,
                      });

                      for (const pr of prs) {
                          await github.rest.issues.createComment({
                              issue_number: pr.number,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body: `Released as [${{ steps.version.outputs.tag }}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${{ steps.version.outputs.tag }})`
                          });
                      }
