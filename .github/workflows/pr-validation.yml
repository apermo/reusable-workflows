name: PR Validation

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

jobs:
    pr-validation:
        uses: ./.github/workflows/reusable-pr-validation.yml
        permissions:
            contents: read
            pull-requests: write
    conventional-commits:
        uses: ./.github/workflows/reusable-conventional-commits.yml
    actionlint:
        name: Lint workflows
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: reviewdog/action-actionlint@v1
              with:
                  # actionlint 1.7.x doesn't know the (valid) github.job_workflow_sha context.
                  actionlint_flags: -ignore 'property "job_workflow_sha" is not defined'
